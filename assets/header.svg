<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arjun Chouksey — Software Developer</title>
  <desc id="desc">A dark gradient banner with abstract code-inspired shapes and the text Arjun Chouksey, software developer building intelligent, useful products.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#10152E"/>
      <stop offset="1" stop-color="#1B0C31"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="70" x2="940" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1050 55) rotate(135) scale(310 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(120 300) rotate(-35) scale(310 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="26" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="26" fill="url(#glowB)"/>

  <g opacity="0.85">
    <circle cx="91" cy="72" r="5" fill="#22D3EE"/>
    <circle cx="110" cy="72" r="5" fill="#8B5CF6"/>
    <circle cx="129" cy="72" r="5" fill="#EC4899"/>
    <rect x="73" y="53" width="285" height="194" rx="18" stroke="#CBD5E1" stroke-opacity="0.12"/>
    <path d="M104 117L132 142L104 167" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M151 181H230" stroke="#CBD5E1" stroke-opacity="0.76" stroke-width="7" stroke-linecap="round"/>
    <path d="M151 112H302" stroke="#64748B" stroke-opacity="0.32" stroke-width="5" stroke-linecap="round"/>
    <path d="M151 137H279" stroke="#64748B" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
    <path d="M151 212H262" stroke="#64748B" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="420" y="111" fill="#94A3B8" font-size="19" font-weight="600" letter-spacing="4">HELLO, I'M</text>
    <text x="416" y="179" fill="#F8FAFC" font-size="59" font-weight="760" letter-spacing="-2">Arjun Chouksey</text>
    <rect x="420" y="199" width="92" height="4" rx="2" fill="url(#accent)"/>
    <text x="420" y="241" fill="#CBD5E1" font-size="22" font-weight="450">Software developer building intelligent, useful products.</text>
  </g>

  <g opacity="0.38" filter="url(#blur)">
    <circle cx="1110" cy="266" r="55" fill="#EC4899"/>
    <circle cx="1022" cy="76" r="48" fill="#8B5CF6"/>
  </g>
  <path d="M929 58C1011 86 1069 137 1103 222" stroke="url(#accent)" stroke-opacity="0.36" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="929" cy="58" r="5" fill="#22D3EE"/>
  <circle cx="1103" cy="222" r="5" fill="#EC4899"/>
</svg>
